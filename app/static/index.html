<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAKOYA（箱家）</title>
<link rel="stylesheet" href="/static/style.css">
<script type="importmap">
{"imports": {"three": "/static/vendor/three/three.module.js", "three/addons/": "/static/vendor/three/addons/"}}
</script>
</head>
<body>
<header>
  <div class="brand">HAKOYA <span>箱家</span></div>
  <label>物件 <select id="alias"></select></label>
  <button id="build" class="primary">読み込んで組み立てる</button>
  <div id="status" class="status">物件を選んでください</div>
  <div class="powered">Powered by Claude</div>
</header>
<main>
  <section class="viewer">
    <nav class="tabs" data-group="view">
      <button data-tab="v3d" class="on">3D</button>
      <button data-tab="vplan">平面図</button>
    </nav>
    <div id="v3d" class="pane on">
      <div class="toolbar">
        <span class="label">表示：</span>
        <label><input type="checkbox" data-part="foundation" checked>基礎</label>
        <label><input type="checkbox" data-part="floor1" checked>1階（床・内壁）</label>
        <label><input type="checkbox" data-part="exterior1" checked>外壁</label>
        <label><input type="checkbox" data-part="soffit" checked>ポーチの天井</label>
        <label><input type="checkbox" data-part="roof" checked>屋根</label>
        <span class="sep"></span>
        <button data-view="iso">斜め</button>
        <button data-view="front">正面（南）</button>
        <button data-view="side">横（西）</button>
        <button data-view="top">上</button>
        <button data-view="explode" id="explode">パーツを離す</button>
      </div>
      <div id="canvas"></div>
    </div>
    <div id="vplan" class="pane"><div id="plan" class="plan">まだ組み立てていません</div></div>
  </section>
  <aside class="side">
    <nav class="tabs" data-group="side">
      <button data-tab="sedit" class="on">表で直す</button>
      <button data-tab="shist">修正の履歴</button>
      <button data-tab="schk">検査</button>
      <button data-tab="sout">書き出し</button>
    </nav>
    <div id="sedit" class="pane on">
      <p class="hint">値を変えて理由を書き、「承認」を押すと修正として記録され、模型が組み直されます。数値は mm（実寸）です。</p>
      <h3>窓・ドア</h3>
      <table id="openings"></table>
      <h3>壁</h3>
      <table id="walls"></table>
    </div>
    <div id="shist" class="pane"><ul id="history" class="list"></ul></div>
    <div id="schk" class="pane"><ul id="checks" class="list"></ul></div>
    <div id="sout" class="pane">
      <p class="hint">3MF は Bambu Studio でそのまま開けます。外壁の部品にだけファジースキン（外側の輪郭）を設定しています。</p>
      <ul id="downloads" class="list"></ul>
    </div>
  </aside>
</main>
<script type="module" src="/static/app.js"></script>
</body>
</html>
