requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "shapely>=2.0",
    "pygltflib>=1.16",
    "pyyaml>=6.0",
    "manifold3d>=3.5",
    "trimesh>=4.0",
    "fastapi>=0.110",
