[project]
name = "hakoya"
version = "0.1.0"
description = "HAKOYA（箱家）：Walk in home のデータから 1/50 の住宅模型の 3D プリント用データを作る"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "shapely>=2.0",
    "pygltflib>=1.16",
    "pyyaml>=6.0",
    "manifold3d>=3.5",
    "trimesh>=4.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pillow>=10.0",
    "claude-agent-sdk>=0.2",
    "anthropic>=2.3",
    "keyring>=25",
    "ezjww>=0.7.6",
    "pdfplumber>=0.11.9",   # 高性能読み込みの PDF の図面（11/4 作者「作ってしまってもいい」。理由は docs/decisions.md）
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyinstaller>=6.10"]

# フォルダの中から動かすソフトなので、自分自身は部品として取り付けない（ライブラリだけ入れる）
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# ★11/5：失敗の表示に、関数に渡した値（物件のファイルの場所＝施主名入り）が出ないように、短い表示にする
addopts = "--tb=short"
markers = [
    "slow: 時間のかかるテスト（編集のたびの自動テストでは飛ばす）",
    "realdata: data/ の実データを使うテスト（data/ がなければ飛ばす）",
]
